<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <style>
        /* SVG delete icon styling to match AC button */
        .del {
            background: rgba(255, 107, 107, 0.15) !important;
        }
        
        .del svg {
            width: 1.4rem;
            height: 1.4rem;
            stroke: var(--danger-color);
            transition: all 0.2s ease;
        }

        .del:hover svg {
            transform: scale(1.1);
            stroke-width: 2.5;
        }

        .del:active svg {
            transform: scale(0.95);
        }

        /* Optional animation for the delete icon */
        @keyframes deletePress {
            0% { transform: translateX(0); }
            50% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        .del:active svg {
            animation: deletePress 0.2s ease;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display-area">
            <div class="previous-operation" id="prevOperation"></div>
            <input type="text" placeholder="0" id="inputBox" readonly>
        </div>
        <div class="all">
            <button class="ac">AC</button>
            <button class="del">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="delete-icon">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                    <line x1="18" y1="9" x2="12" y2="15"></line>
                    <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
            <button class="operator">%</button>
            <button class="operator">÷</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalBtn">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
